services:
  flyaimovie:
    build: .
    ports:
      - "${APP_PORT:-5679}:5679"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "5679"
      APP_ENV: development
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /app/data/flyaimovie.db
      STORAGE_LOCAL_PATH: /app/data/storage
      AUTH_SECURE_COOKIES: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5679/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
