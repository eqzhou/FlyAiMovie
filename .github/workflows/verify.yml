name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify backend
        working-directory: backend
        run: |
          go test ./... -race -count=1
          go vet ./...
          go test ./... -coverprofile=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 80) exit 1 }'
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      APP_PORT: "5679"
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL Compose cold start
        run: |
          docker compose up -d --build
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:5679/api/v1/health; do sleep 2; done'
          curl -fsS http://127.0.0.1:5679/api/v1/auth/status | grep -q '"setup_required":true'
          docker compose down -v
      - name: Verify SQLite Compose cold start
        if: always()
        run: |
          docker compose down -v || true
          docker compose -f docker-compose.sqlite.yml up -d --build
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:5679/api/v1/health; do sleep 2; done'
          curl -fsS http://127.0.0.1:5679/api/v1/auth/status | grep -q '"setup_required":true'
      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.sqlite.yml logs --no-color || docker compose logs --no-color
      - name: Clean containers
        if: always()
        run: docker compose -f docker-compose.sqlite.yml down -v || true
