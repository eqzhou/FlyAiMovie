name: supply-chain-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-bake.hcl
      - backend/**
      - frontend/**
      - configs/**
      - scripts/build-oci.sh
      - scripts/check-no-publish.sh
      - .github/workflows/supply-chain-build.yml

permissions:
  contents: read

jobs:
  oci-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce no-publish policy
        run: bash scripts/check-no-publish.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build multi-architecture OCI archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: flyaimovie:ci
          outputs: type=oci,dest=${{ runner.temp }}/flyaimovie-oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload OCI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flyaimovie-oci
          path: ${{ runner.temp }}/flyaimovie-oci.tar
          if-no-files-found: error
          retention-days: 7
